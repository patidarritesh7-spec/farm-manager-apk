plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radhe.farm'
    compileSdk 34

    defaultConfig {
        applicationId "com.radhe.farm"
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // Fixed signing key: har naya APK purane ke upar update ho sake (data delete nahi hoga)
    signingConfigs {
        farm {
            storeFile file('farm-release.jks')
            storePassword 'kisanfarm'
            keyAlias 'farm'
            keyPassword 'kisanfarm'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.farm
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.farm
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
