name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kisan-bahi-book.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KisanBahiBook-APK
          path: kisan-bahi-book.apk
          if-no-files-found: error

      - name: Publish to Release (easy download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Kisan Bahi-Book APK
          body: "Install on Android 10+. Allow 'install from unknown apps' when asked."
          files: kisan-bahi-book.apk
